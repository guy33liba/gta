<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a0f" />
    <meta name="description" content="Original browser-based open-world 3D action game prototype." />
    <title>Urban Heat — Browser Open World</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game-canvas" aria-label="3D game viewport"></canvas>
      <div id="damage-flash" aria-hidden="true"></div>
      <section id="hud" aria-label="Game HUD">
        <div id="hud-top">
          <div id="brand">URBAN HEAT</div>
          <div id="crosshair" aria-hidden="true">+</div>
          <div id="hit-marker" aria-hidden="true">×</div>
          <div id="mission-state">FREE ROAM</div>
          <div id="mission-panel"><div id="mission-title">MISSION</div><div id="mission-objective">Reach the pickup point</div><div id="mission-distance"></div></div>
        </div>
        <div id="hud-bottom">
          <div id="status-card">
            <div id="status-health">HEALTH <span id="health-value">100</span></div>
            <div id="status-cash">$<span id="cash-value">250</span></div>
            <div id="status-ammo">AMMO <span id="ammo-value">12 / 60</span></div>
            <div id="status-wanted">WANTED <span id="wanted-value">CLEAR</span></div>
          </div>
          <div id="controls-card">
            <span>WASD MOVE</span>
            <span>SHIFT SPRINT</span>
            <span>E ENTER VEHICLE</span>
            <span>CLICK FIRE · R RELOAD · M MISSION</span>
          </div>
        </div>
      </section>
      <section id="touch-controls" aria-label="Touch controls">
        <div id="touch-dpad">
          <button id="touch-up" type="button" aria-label="Move forward">▲</button>
          <button id="touch-left" type="button" aria-label="Move left">◀</button>
          <button id="touch-down" type="button" aria-label="Move backward">▼</button>
          <button id="touch-right" type="button" aria-label="Move right">▶</button>
        </div>
        <div id="touch-actions">
          <button id="touch-enter" type="button" aria-label="Enter or exit vehicle">E</button>
          <button id="touch-fire" type="button" aria-label="Fire">FIRE</button>
          <button id="touch-sprint" type="button" aria-label="Sprint">RUN</button>
        </div>
      </section>
      <div id="loading-screen">
        <div id="loading-title">URBAN HEAT</div>
        <div id="loading-copy">INITIALIZING CITY</div>
        <div id="loading-bar"><span id="loading-progress"></span></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
